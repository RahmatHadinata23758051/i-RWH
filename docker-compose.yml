services:
  # 1. Mosquitto MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: irwh_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # 2. InfluxDB v2 Time-Series Database
  influxdb:
    image: influxdb:2.7
    container_name: irwh_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=polinela_admin_password_2026
      - DOCKER_INFLUXDB_INIT_ORG=polinela_lab
      - DOCKER_INFLUXDB_INIT_BUCKET=irwh_sensors
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=your-super-secret-admin-token
    volumes:
      - influxdb_data:/var/lib/influxdb2

  # 3. Fastify REST & Real-Time API Server
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: irwh_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - API_KEY=polinela_irwh_secret_key_2026
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=your-super-secret-admin-token
      - INFLUX_ORG=polinela_lab
      - INFLUX_BUCKET=irwh_sensors
      - MQTT_BROKER_URL=mqtt://sdp.polinela.ac.id:1883
      - MQTT_USERNAME=septa
      - MQTT_PASSWORD=123321
      - MQTT_TOPIC_PREFIX=polinela/lab/
    depends_on:
      - influxdb

  # 4. Frontend React Dashboard (Nginx SPA Production Server)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: irwh_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
